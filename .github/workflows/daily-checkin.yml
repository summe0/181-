name: Daily Check-in

on:
  workflow_dispatch:

  # GitHub 使用 UTC；UTC 00:15 = 北京时间 08:15
  # schedule:
  #   - cron: "15 0 * * *"

permissions:
  contents: read

concurrency:
  group: daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CHECKIN_PASSWORD: ${{ secrets.CHECKIN_PASSWORD }}
      WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run daily check-in
        shell: bash
        run: |
          set -o pipefail
          python -u daily_checkin.py 2>&1 | tee checkin.log
        continue-on-error: true

      - name: Check result
        shell: bash
        run: |
          cat checkin.log
          echo "Checkin finished, ignore result"
          exit 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: checkin.log
          retention-days: 7
