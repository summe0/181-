name: Daily Check-in

on:
  schedule:
    # GitHub 使用 UTC；UTC 00:00 = 北京时间 08:00。
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHECKIN_PASSWORD: ${{ secrets.CHECKIN_PASSWORD }}
      BARK_URL: ${{ secrets.BARK_URL }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run daily check-in
        shell: bash
        run: |
          set -o pipefail
          python daily_checkin_22_units.py 2>&1 | tee checkin.log
        continue-on-error: true

      - name: Check result
        shell: bash
        run: |
          if grep -q "成功: 22, 失败: 0" checkin.log; then
            echo "All check-ins successful"
          else
            echo "Some check-ins failed"
            exit 1
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: checkin.log
          retention-days: 7
